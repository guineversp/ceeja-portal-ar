<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CEEJA Portal AR — Diagnóstico do Marcador v1.3</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
    #status{
      position:fixed;z-index:9999;left:18px;right:18px;top:20px;
      padding:14px 16px;border-radius:18px;background:rgba(9,19,28,.82);
      color:#fff;text-align:center;font-size:18px;line-height:1.25;
      box-shadow:0 8px 30px rgba(0,0,0,.25)
    }
    #status.ok{background:rgba(0,105,75,.9)}
    #version{
      position:fixed;z-index:9999;left:20px;bottom:20px;
      color:#fff;background:rgba(9,19,28,.75);padding:9px 13px;border-radius:14px;font-size:14px
    }
    .a-enter-vr{display:none!important}
  </style>
  <script>
    AFRAME.registerComponent('marker-diagnostic', {
      init: function () {
        const status = document.getElementById('status');
        this.el.addEventListener('markerFound', () => {
          status.textContent = '✅ MARCADOR RECONHECIDO — rastreamento funcionando';
          status.classList.add('ok');
        });
        this.el.addEventListener('markerLost', () => {
          status.textContent = 'Marcador perdido. Mostre o desenho inteiro, com toda a borda preta.';
          status.classList.remove('ok');
        });
      }
    });

    AFRAME.registerComponent('camera-layer-fix', {
      init: function () {
        const fix = () => {
          const v = document.querySelector('video#arjs-video');
          const c = document.querySelector('.a-canvas');
          if(v){
            Object.assign(v.style,{
              position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',
              objectFit:'cover',zIndex:'1',display:'block',visibility:'visible'
            });
          }
          if(c){
            Object.assign(c.style,{
              position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',
              zIndex:'2',background:'transparent'
            });
          }
          if(this.el.renderer) this.el.renderer.setClearColor(0x000000,0);
        };
        this.el.addEventListener('render-target-loaded', fix);
        setTimeout(fix,300); setTimeout(fix,1000); setTimeout(fix,2500);
      }
    });
  </script>
</head>
<body>
  <div id="status">Aponte a câmera para o marcador. Vamos testar apenas o reconhecimento.</div>
  <div id="version">CEEJA • diagnóstico do marcador • v1.3</div>

  <a-scene
    embedded
    camera-layer-fix
    renderer="alpha:true; antialias:true; logarithmicDepthBuffer:true;"
    vr-mode-ui="enabled:false"
    arjs="sourceType:webcam; videoTexture:false; debugUIEnabled:false; detectionMode:mono; patternRatio:0.70; trackingMethod:best;">

    <a-marker type="pattern" url="./marcador.patt" marker-diagnostic
              smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
      <a-box position="0 0.45 0" scale="0.65 0.65 0.65"
             material="color:#00ffff; opacity:0.88; transparent:true"
             animation="property:rotation; to:0 360 0; loop:true; dur:2200; easing:linear">
      </a-box>
      <a-ring position="0 0.03 0" rotation="-90 0 0"
              radius-inner="0.55" radius-outer="0.62"
              material="color:#ffffff; opacity:0.9; transparent:true">
      </a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
