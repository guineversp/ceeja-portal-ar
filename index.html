<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CEEJA Portal AR — Atravessável v1.5.1</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
#status{
 position:fixed;z-index:9999;left:18px;right:18px;top:20px;padding:13px 16px;
 border-radius:18px;background:rgba(9,19,28,.82);color:#fff;text-align:center;
 font-size:17px;line-height:1.25;box-shadow:0 8px 30px rgba(0,0,0,.25)
}
#status.ok{background:rgba(0,105,75,.88)}
#version{
 position:fixed;z-index:9999;left:20px;bottom:20px;color:#fff;
 background:rgba(9,19,28,.75);padding:9px 13px;border-radius:14px;font-size:14px
}
.a-enter-vr{display:none!important}
#insideWorld{
 position:fixed;inset:0;z-index:3;display:none;overflow:hidden;
 background:
 radial-gradient(circle at 72% 20%,rgba(220,155,255,.95) 0 6%,transparent 6.5%),
 linear-gradient(to bottom,#15133c 0 52%,#211d58 52% 100%);
}
#insideWorld.active{display:block}
#insideWorld .moon{position:absolute;right:12%;top:13%;width:23vw;height:23vw;border-radius:50%;background:#d7a0ff;box-shadow:0 0 45px rgba(215,160,255,.45)}
#insideWorld .mountain{position:absolute;bottom:30%;width:0;height:0;border-left:34vw solid transparent;border-right:34vw solid transparent;border-bottom:54vw solid #443b86}
#insideWorld .m1{left:-17vw}.insideWorld .m2{right:-17vw}
#insideWorld .m2{right:-18vw;border-bottom-color:#332d70}
#insideWorld .road{position:absolute;left:40%;bottom:-4%;width:20%;height:58%;background:linear-gradient(#55f4ef,#24bfc3);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
#insideWorld .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#75ffff;box-shadow:0 0 18px #75ffff}
#exitPortal{
 position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
 width:38vw;height:58vw;max-width:220px;max-height:340px;border:12px solid #00e6df;
 box-shadow:0 0 30px rgba(0,230,223,.65), inset 0 0 24px rgba(0,230,223,.35);
 background:rgba(0,0,0,.22)
}
#insideHint{position:absolute;left:18px;right:18px;top:20px;padding:13px 16px;border-radius:18px;background:rgba(21,19,60,.82);color:#fff;text-align:center;font-size:17px}
#backBtn{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);border:0;border-radius:999px;padding:12px 20px;font-size:16px;font-weight:700;background:#fff;color:#15133c}
</style>

<script>
AFRAME.registerComponent('marker-status', {
 init:function(){
   const s=document.getElementById('status');
   this.el.addEventListener('markerFound',()=>{
     s.textContent='🚪 Portal encontrado — aproxime-se devagar.';
     s.classList.add('ok');
   });
   this.el.addEventListener('markerLost',()=>{
     s.textContent='Aponte a câmera para o marcador.';
     s.classList.remove('ok');
   });
 }
});

AFRAME.registerComponent('camera-layer-fix', {
 init:function(){
   const fix=()=>{
     const v=document.querySelector('video#arjs-video');
     const c=document.querySelector('.a-canvas');
     if(v){
       Object.assign(v.style,{
         position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',
         objectFit:'cover',zIndex:'1',display:'block',visibility:'visible'
       });
     }
     if(c){
       Object.assign(c.style,{
         position:'fixed',top:'0',left:'0',width:'100vw',height:'100vh',
         zIndex:'2',background:'transparent'
       });
     }
     if(this.el.renderer) this.el.renderer.setClearColor(0x000000,0);
   };
   this.el.addEventListener('render-target-loaded',fix);
   setTimeout(fix,300);setTimeout(fix,1000);setTimeout(fix,2500);
 }
});

/* A simple, robust "window to another world".
   No stencil buffer: the portal interior is a physical plane showing a
   stylized scene, while the real camera remains visible everywhere else. */
AFRAME.registerComponent('portal-world', {
 init:function(){
   const root=this.el;

   // Tiny floating lights animate inside the portal area.
   const pts=[
     [-.55,1.05,.015],[-.25,1.55,.018],[.10,1.25,.016],[.43,1.72,.019],
     [.58,.82,.017],[-.45,.62,.018],[.22,.55,.019]
   ];
   pts.forEach((p,i)=>{
     const e=document.createElement('a-sphere');
     e.setAttribute('position',p.join(' '));
     e.setAttribute('radius', i%2 ? '.045' : '.032');
     e.setAttribute('material',`color:${i%2?'#ff91f6':'#75ffff'}; shader:flat; opacity:.95`);
     e.setAttribute('animation',
       `property:position; dir:alternate; dur:${1500+i*180}; loop:true; to:${p[0]} ${p[1]+.16} ${p[2]}`);
     root.appendChild(e);
   });
 }
});

AFRAME.registerComponent('portal-traverse', {
 init:function(){
   this.inside=false;
   this.marker=this.el;
   this.cam=null;
   this.portalCenter=new THREE.Vector3(0,1.0,0);
   this.worldPos=new THREE.Vector3();
   this.camPos=new THREE.Vector3();
   this.lastVisible=0;

   const back=()=>this.leave();
   document.getElementById('backBtn').addEventListener('click',back);
 },
 enter:function(){
   if(this.inside) return;
   this.inside=true;
   document.getElementById('insideWorld').classList.add('active');
   document.getElementById('status').style.display='none';
   document.getElementById('version').textContent='CEEJA • Portal RA • dentro de memorias';
 },
 leave:function(){
   this.inside=false;
   document.getElementById('insideWorld').classList.remove('active');
   document.getElementById('status').style.display='block';
   document.getElementById('version').textContent='CEEJA • Portal RA • memorias';
 },
 tick:function(){
   if(this.inside) return;
   if(!this.marker.object3D.visible) return;
   const camEl=document.querySelector('[camera]');
   if(!camEl || !camEl.object3D) return;

   // Portal center in world coordinates and camera world position.
   this.worldPos.copy(this.portalCenter);
   this.marker.object3D.localToWorld(this.worldPos);
   camEl.object3D.getWorldPosition(this.camPos);
   const d=this.worldPos.distanceTo(this.camPos);

   // On AR.js marker tracking the units are marker-relative. Trigger only very close,
   // after the user intentionally approaches the doorway.
   const s=document.getElementById('status');
   if(d < 2.75){
      s.textContent='✨ Quase lá — atravesse a abertura…';
   }
   if(d < 2.08){
      this.enter();
   }
 }
});

</script>
</head>

<body>
<div id="status">Aponte a câmera para o marcador.</div>
<div id="version">CEEJA • Portal RA • memorias</div>

<div id="insideWorld" style="background-image:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.10)),url('./CONTEUDO/cenario.jpg');background-size:cover;background-position:center;">
  <div id="insideHint">✨ Você atravessou o portal</div>
  <div id="exitPortal"></div>
  <button id="backBtn">↩ Voltar pelo portal</button>
</div>


<a-scene
 embedded
 camera-layer-fix
 renderer="alpha:true; antialias:true; logarithmicDepthBuffer:true;"
 vr-mode-ui="enabled:false"
 arjs="sourceType:webcam; videoTexture:false; debugUIEnabled:false; detectionMode:mono; patternRatio:0.70; trackingMethod:best;">

 <a-assets><img id="portalImg" src="./CONTEUDO/cenario.jpg"></a-assets>

 <a-marker type="pattern" url="./marcador.patt" marker-status portal-traverse
           smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

   <!-- Portal group: upright relative to the marker -->
   <a-entity position="0 0 0">

     <!-- Cenário escolhido pelo professor -->
     <a-plane position="0 .84 .015" width="1.82" height="1.58"
              material="shader:flat;src:#portalImg;side:double"></a-plane>

     <!-- physical luminous frame -->
     <a-box position="-1.01 .84 .06" width=".13" height="1.80" depth=".12"
            material="color:#00e6df;shader:flat;opacity:.92"></a-box>
     <a-box position="1.01 .84 .06" width=".13" height="1.80" depth=".12"
            material="color:#00e6df;shader:flat;opacity:.92"></a-box>
     <a-box position="0 1.69 .06" width="2.15" height=".13" depth=".12"
            material="color:#00e6df;shader:flat;opacity:.92"></a-box>
     <a-box position="0 -.03 .06" width="2.15" height=".10" depth=".12"
            material="color:#00e6df;shader:flat;opacity:.88"></a-box>

   </a-entity>
 </a-marker>

 <a-entity camera></a-entity>
</a-scene>
</body>
</html>
