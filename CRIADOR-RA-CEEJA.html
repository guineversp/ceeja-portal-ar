<h1>Criador de Experiência RA</h1><p class="sub">CEEJA • Quiz, imagem, áudio, vídeo, objeto 3D e Portal RA • v6.3.</p>
<div class="card"><b>1. O que você quer criar?</b><div class="types">
<div class="type sel" data-t="quiz">❓<br>QUIZ</div><div class="type" data-t="imagem">🖼️<br>IMAGEM</div><div class="type" data-t="audio">🔊<br>ÁUDIO</div><div class="type" data-t="video">🎬<br>VÍDEO</div><div class="type" data-t="3d">🧊<br>OBJETO 3D</div><div class="type" data-t="portal">🚪<br>PORTAL</div>
</div></div>
<div class="card"><b>2. Marcador</b><label>Arquivo .patt</label><input id="patt" type="file" accept=".patt"><label>Imagem do marcador (opcional)</label><input id="markerImg" type="file" accept="image/png,image/jpeg"></div>
<div class="card"><b>3. Conteúdo</b>
<label>Título</label><input id="title" placeholder="Ex.: Arte Moderna">

</div>

function rt(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsText(f)})}function rb(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsArrayBuffer(f)})}
function safe(o){return JSON.stringify(o).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026')}
$('make').onclick=async()=>{let msg=$('msg');msg.className='';msg.textContent='Montando…';try{
let patt=$('patt').files[0];if(!patt)throw Error('Escolha o arquivo .patt.');let d={tipo,titulo:$('title').value.trim()||'Experiência RA'};
let media=null,ext='';
if(tipo==='quiz'){d.pergunta=$('question').value.trim();d.alternativas={A:$('a').value.trim(),B:$('b').value.trim(),C:$('c').value.trim()};d.correta=$('correct').value;d.acertou=$('yes').value.trim();d.errou=$('no').value.trim();if(!d.pergunta||!d.alternativas.A||!d.alternativas.B||!d.alternativas.C)throw Error('Preencha pergunta e alternativas.')}
else{media=$('media').files[0];if(!media)throw Error('Escolha o arquivo de '+tipo+'.');d.texto=$('text').value.trim();ext=(media.name.split('.').pop()||'').toLowerCase();if(ext==='jpeg')ext='jpg';if(tipo==='3d'&&ext!=='glb')throw Error('Para Objeto 3D, escolha um arquivo .GLB.');if(tipo==='portal'&&!['png','jpg'].includes(ext))throw Error('Para Portal, escolha uma imagem PNG ou JPG.');d.ext=ext;}
let nomeExp=(d.titulo||'Minha Experiencia RA')
 .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/[^a-zA-Z0-9 _-]/g,'')
 .trim().replace(/\s+/g,'-')
 .replace(/-+/g,'-');
if(!nomeExp)nomeExp='Minha-Experiencia-RA';
let z=new JSZip(),f=z.folder(nomeExp);
if(tipo==='portal'){
  let pe=PORTAL_ENGINE.replaceAll('__EXT__',ext).replaceAll('__TITLE__',(d.titulo||'Meu Portal').replace(/[<>]/g,''));
  f.file('index.html',pe);
}else{
  f.file('index.html',ENGINE.replace('__DATA__',safe(d)));
